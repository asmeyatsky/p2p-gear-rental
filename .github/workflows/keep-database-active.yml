name: Keep Database Active

on:
  schedule:
    # Run every 24 hours at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping staging health endpoints
        run: |
          echo "Pinging staging environment..."
          curl -sf "https://p2p-gear-rental-staging-737733013547.europe-west2.run.app/api/health" || true
          curl -sf "https://p2p-gear-rental-staging-737733013547.europe-west2.run.app/api/health/database" || true

      - name: Write to Supabase database directly
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          npm install pg

          node --dns-result-order=ipv4first << 'SCRIPT'
          const { Client } = require("pg");

          async function keepAlive() {
            const client = new Client({
              connectionString: process.env.DATABASE_URL,
              ssl: { rejectUnauthorized: false },
            });

            await client.connect();
            console.log("Connected to database");

            await client.query(`
              CREATE TABLE IF NOT EXISTS _keepalive (
                id SERIAL PRIMARY KEY,
                pinged_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
              )
            `);

            await client.query("INSERT INTO _keepalive (pinged_at) VALUES (NOW())");
            console.log("Inserted keepalive row");

            await client.query("DELETE FROM _keepalive WHERE pinged_at < NOW() - INTERVAL '7 days'");

            const res = await client.query("SELECT COUNT(*) AS remaining FROM _keepalive");
            console.log("Remaining rows:", res.rows[0].remaining);

            await client.end();
            console.log("Database keepalive completed!");
          }

          keepAlive().catch((err) => {
            console.error("Keepalive failed:", err.message);
            process.exit(1);
          });
          SCRIPT
