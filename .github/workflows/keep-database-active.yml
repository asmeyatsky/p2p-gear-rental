name: Keep Database Active

on:
  schedule:
    # Run every 24 hours at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping staging health endpoints
        run: |
          echo "Pinging staging environment..."
          curl -sf "https://p2p-gear-rental-staging-737733013547.europe-west2.run.app/api/health" || true
          curl -sf "https://p2p-gear-rental-staging-737733013547.europe-west2.run.app/api/health/database" || true

      - name: Disable IPv6 (Supabase requires IPv4)
        run: sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1

      - name: Write to Supabase database directly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Writing keepalive record to database..."

          psql "$DATABASE_URL" <<'SQL'
            CREATE TABLE IF NOT EXISTS _keepalive (
              id SERIAL PRIMARY KEY,
              pinged_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );

            INSERT INTO _keepalive (pinged_at) VALUES (NOW());

            DELETE FROM _keepalive WHERE pinged_at < NOW() - INTERVAL '7 days';

            SELECT COUNT(*) AS remaining_rows FROM _keepalive;
          SQL

          echo "Database keepalive write completed!"
